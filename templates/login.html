<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — BIP-PME Analytics</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #e6e8ee;
    background: #0d1017;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .login-card {
    width: 100%;
    max-width: 380px;
    background: #161a22;
    border: 1px solid #232833;
    border-radius: 16px;
    padding: 32px 26px 26px;
    box-shadow: 0 20px 40px -12px rgba(0, 0, 0, .55);
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #7c88f0, #22d3ee);
    color: #0b0f14;
    font-variation-settings: 'FILL' 1, 'wght' 600, 'opsz' 24;
    font-size: 1.3rem;
    box-shadow: 0 8px 20px rgba(124, 136, 240, .35);
  }

  .brand-text {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -.02em;
    color: #f1f5f9;
  }

  .brand-text span { color: #7dd3fc; }

  .brand-sub {
    text-align: center;
    font-size: .75rem;
    color: #8a8f99;
    margin: 6px 0 22px;
  }

  .erro {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 180, 171, .10);
    border: 1px solid rgba(255, 180, 171, .28);
    color: #ffb4ab;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: .82rem;
    margin-bottom: 16px;
    line-height: 1.35;
  }

  .erro .material-symbols-rounded { font-size: 1.1rem; flex-shrink: 0; }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: .74rem;
    font-weight: 600;
    color: #c3c6cf;
    margin-bottom: 6px;
  }

  .field-input { position: relative; }

  .field-input .material-symbols-rounded {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.15rem;
    color: #8a8f99;
    pointer-events: none;
    transition: color .15s ease;
  }

  .field-input input {
    width: 100%;
    padding: 11px 12px 11px 40px;
    border-radius: 10px;
    border: 1px solid #2f3542;
    background: #0f131a;
    color: #e6e8ee;
    font: inherit;
    font-size: .9rem;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }

  .field-input input::placeholder { color: #5b6170; }

  .field-input input:focus {
    outline: none;
    border-color: #7c88f0;
    background: #0d1119;
    box-shadow: 0 0 0 3px rgba(124, 136, 240, .18);
  }

  .field-input:focus-within .material-symbols-rounded { color: #a8b4ff; }

  .btn-entrar {
    width: 100%;
    padding: 12px 14px;
    border: none;
    border-radius: 10px;
    font: inherit;
    font-size: .9rem;
    font-weight: 700;
    color: #0b0f14;
    background: linear-gradient(135deg, #a8b4ff, #7dd3fc);
    cursor: pointer;
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .1s ease, filter .15s ease;
    box-shadow: 0 8px 20px -8px rgba(124, 136, 240, .55);
  }

  .btn-entrar:hover  { filter: brightness(1.05); }
  .btn-entrar:active { transform: translateY(1px); }

  .btn-entrar .material-symbols-rounded { font-size: 1.1rem; }

  .sep {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #5b6170;
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .12em;
    margin: 22px 0 16px;
  }

  .sep::before,
  .sep::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #262b36;
  }

  .field-codigo input {
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 600;
  }

  @media (max-width: 420px) {
    .login-card { padding: 26px 20px 22px; border-radius: 14px; }
  }
</style>
</head>
<body>

<form class="login-card" method="post" novalidate>

  <div class="brand">
    <span class="brand-icon material-symbols-rounded" aria-hidden="true">insights</span>
    <span class="brand-text">BIP<span>Analytics</span></span>
  </div>
  <p class="brand-sub">Plataforma de Análise Empresarial</p>

  {% if erro %}
    <div class="erro" role="alert">
      <span class="material-symbols-rounded" aria-hidden="true">error</span>
      <span>{{ erro }}</span>
    </div>
  {% endif %}

  <div class="field">
    <label for="email">Email</label>
    <div class="field-input">
      <span class="material-symbols-rounded" aria-hidden="true">mail</span>
      <input type="email" id="email" name="email"
             placeholder="exemplo@empresa.co.mz"
             autocomplete="username"
             autofocus>
    </div>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="field-input">
      <span class="material-symbols-rounded" aria-hidden="true">lock</span>
      <input type="password" id="password" name="password"
             placeholder="••••••••"
             autocomplete="current-password">
    </div>
  </div>

  <button type="submit" class="btn-entrar">
    <span class="material-symbols-rounded" aria-hidden="true">login</span>
    Entrar
  </button>

  <div class="sep">ou</div>

  <div class="field field-codigo">
    <label for="access_code">Código de acesso · operadores</label>
    <div class="field-input">
      <span class="material-symbols-rounded" aria-hidden="true">key</span>
      <input type="text" id="access_code" name="access_code"
             placeholder="BIP-XXXX-XXXX"
             autocomplete="off"
             spellcheck="false">
    </div>
  </div>

</form>

</body>
</html>
